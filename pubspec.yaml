name: swipeinn
description: "Swipeinn - Swipe. Match. Move in. A general rental discovery app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # UI, Icons & Animations
  flutter_card_swiper: ^7.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  intl: ^0.19.0
  uuid: ^4.4.0

  # Backend: Supabase Auth, Postgres, Realtime and Storage
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6

  # Photo picking for listing uploads
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
