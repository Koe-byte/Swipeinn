name: rently
description: "Rently - Swipe-Based Student Housing & Bilateral Discovery Engine"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # UI, Icons & Animations
  flutter_card_swiper: ^7.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  intl: ^0.19.0
  uuid: ^4.4.0

  # Firebase Suite
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
